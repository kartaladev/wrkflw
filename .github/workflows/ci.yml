name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        run: go build ./...

      # Blocker 7: internal/dbtest boots its containers from a package-level
      # sync.Once and Go builds one test binary per package, so `go test ./...`
      # otherwise pays 10 Postgres + 7 MySQL container boots. Starting one server
      # of each here and exporting the two DSNs collapses that to one each.
      #
      # Deliberately the SAME script a developer runs locally, so CI and local
      # runs share one code path.
      #
      # Note what these two steps make this job: the shared-server path is CI's
      # DEFAULT configuration, taken on every run, not an opt-in. The per-package
      # testcontainer fallback still exists — unset both variables and it is taken
      # — but CI never exercises it, so anything the shared path gets wrong is a CI
      # failure, not a lost optimisation. In particular `go test ./...` runs up to
      # GOMAXPROCS package binaries CONCURRENTLY and every one of them now creates
      # its per-test databases in ONE namespace; internal/dbtest/dbname.go is what
      # keeps them apart (per-PROCESS database names, plus an ownership check on
      # every DROP). If either step here fails, the job fails — deliberately,
      # rather than silently falling back to a configuration CI does not test.
      - name: Start shared test databases
        run: bash scripts/testdb.sh up > /dev/null

      - name: Export shared test database DSNs
        run: bash scripts/testdb.sh env >> "$GITHUB_ENV"

      # The suite still uses testcontainers-go for anything not covered above
      # (e.g. mailpit) and for dbtest's custom-credentials path.
      # ubuntu-latest ships a working Docker daemon, so no extra setup is needed.
      # -timeout is explicit. Go's implicit default is also 600s, but an implicit
      # value cannot be checked: nothing enforced the rule that eventuallyBudget
      # x the densest package's site count must stay under it.
      # scripts/check-test-timeout.sh now does, reading this literal and the
      # identical one in scripts/coverage.sh. Change both together.
      - name: Test (race + coverage)
        run: go test -race -timeout=600s -coverprofile=cover.out ./...

      - name: Coverage summary (excludes generated files)
        run: scripts/coverage.sh cover.out

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  extraction:
    name: extraction constraint (internal/database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The database toolkit must import only stdlib + drivers, never any other
      # wrkflw package, so it stays extractable. No Docker needed.
      - name: Check toolkit extraction constraint
        run: bash scripts/check-extraction.sh

  test-timeout-budget:
    name: Eventually budget vs go test -timeout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # eventuallyBudget x the densest package's site count must stay under the
      # go test binary timeout, or a mass failure is reported
      # as "panic: test timed out" with no assertion messages. Every number is
      # derived from source. Pure bash + grep: no Go toolchain, no Docker.
      # Deliberately its own job so a violation is reported even when the suite
      # itself is the thing timing out.
      - name: Check Eventually budget fits the test timeout
        run: bash scripts/check-test-timeout.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify go.mod is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      # Pinned deliberately, on both axes.
      #
      # The action major selects the golangci-lint SERIES: v6 installs the v1
      # line, v9 installs v2. .golangci.yml here has been `version: "2"` all
      # along, so v6 was pairing a v2 config with a v1 binary. That mismatch was
      # masked by a louder failure — v1.64.8 is built with go1.24 and refuses a
      # go.mod targeting a newer Go with "the Go language version (go1.24) used
      # to build golangci-lint is lower than the targeted Go version". The job
      # exited 3 during config load, so it had NEVER linted a single file and
      # reported zero findings while doing so.
      #
      # `version: latest` is what let that drift in silently: the resolved
      # binary changed under us with no diff. An exact version means a lint
      # result only changes when this line does.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Pinned for the same reason as golangci-lint above: `@latest` lets the
      # scanner change without a diff. Note this pins the TOOL, not the answer —
      # govulncheck queries the vulnerability database at run time, so newly
      # published advisories still surface on the next run, which is the point.
      #
      # What actually keeps this job honest is the Go version. Every stdlib
      # finding is reported against the toolchain that built the code, so the
      # `go` directive in go.mod is the real input here; setup-go above reads it
      # via go-version-file.
      - name: Run govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
