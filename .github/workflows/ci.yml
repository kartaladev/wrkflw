name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    name: build & test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # `./...` is the ROOT MODULE ONLY. This repository is a Go workspace
      # (go.work: `.` and `./examples`) and a workspace does NOT widen `./...`
      # — measured on this tree, `go list ./...` returns 69 packages and none
      # of them is under examples/, while `go list ./... ./examples/...`
      # returns 112. So a bare `./...` here would not FAIL after the module
      # split; it would succeed having compiled 43 fewer packages.
      #
      # scripts/modules.sh turns the workspace into one package pattern per
      # module and refuses to emit an empty or short list. Capture it into a
      # variable rather than inlining `$(...)`: a command substitution that
      # fails inside a simple command does not trip `set -e`, and `go build`
      # with no arguments exits 0.
      - name: Build (every workspace module)
        run: |
          set -euo pipefail
          mods="$(scripts/modules.sh)"
          echo "package patterns: ${mods}"
          go build ${mods}

      # Blocker 7: internal/dbtest boots its containers from a package-level
      # sync.Once and Go builds one test binary per package, so `go test ./...`
      # otherwise pays 10 Postgres + 7 MySQL container boots. Starting one server
      # of each here and exporting the two DSNs collapses that to one each.
      #
      # Deliberately the SAME script a developer runs locally, so CI and local
      # runs share one code path.
      #
      # Note what these two steps make this job: the shared-server path is CI's
      # DEFAULT configuration, taken on every run, not an opt-in. The per-package
      # testcontainer fallback still exists — unset both variables and it is taken
      # — but CI never exercises it, so anything the shared path gets wrong is a CI
      # failure, not a lost optimisation. In particular `go test ./...` runs up to
      # GOMAXPROCS package binaries CONCURRENTLY and every one of them now creates
      # its per-test databases in ONE namespace; internal/dbtest/dbname.go is what
      # keeps them apart (per-PROCESS database names, plus an ownership check on
      # every DROP). If either step here fails, the job fails — deliberately,
      # rather than silently falling back to a configuration CI does not test.
      - name: Start shared test databases
        run: bash scripts/testdb.sh up > /dev/null

      - name: Export shared test database DSNs
        run: bash scripts/testdb.sh env >> "$GITHUB_ENV"

      # The suite still uses testcontainers-go for anything not covered above
      # (e.g. mailpit) and for dbtest's custom-credentials path.
      # ubuntu-latest ships a working Docker daemon, so no extra setup is needed.
      # -timeout is explicit. Go's implicit default is also 600s, but an implicit
      # value cannot be checked: nothing enforced the rule that eventuallyBudget
      # x the densest package's site count must stay under it.
      # scripts/check-test-timeout.sh now does, reading this literal and the
      # identical one in scripts/coverage.sh. Change both together.
      #
      # The pattern list spans every workspace module, so `examples/migrate` —
      # the only test outside the root module — actually runs. A single
      # invocation over several modules writes ONE merged coverprofile
      # (verified: rows from both modules under one `mode:` header), so the
      # coverage step below is unchanged and the measured domain stays what a
      # pre-split `./...` covered.
      #
      # -timeout=600s stays an INLINE LITERAL: scripts/check-test-timeout.sh
      # greps this file for it and hard-fails if it is absent or disagrees with
      # scripts/coverage.sh. Do not hoist it into a variable, and do not
      # replace this step with a call to scripts/coverage.sh.
      - name: Test (race + coverage)
        run: |
          set -euo pipefail
          mods="$(scripts/modules.sh)"
          go test -race -timeout=600s -coverprofile=cover.out ${mods}

      - name: Coverage summary (excludes generated files)
        run: scripts/coverage.sh cover.out

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: cover.out
          if-no-files-found: ignore

  extraction:
    name: extraction constraint (internal/database)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # The database toolkit must import only stdlib + drivers, never any other
      # wrkflw package, so it stays extractable. No Docker needed.
      - name: Check toolkit extraction constraint
        run: bash scripts/check-extraction.sh

  test-timeout-budget:
    name: Test wait budget vs go test -timeout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # A package's worst-case failure cost — eventuallyBudget x its site count,
      # PLUS the sum of its raw `select { case <-time.After(d) }` deadlines —
      # must stay under the go test binary timeout, or a mass failure is reported
      # as "panic: test timed out" with no assertion messages. Every number is
      # derived from source. Pure bash + grep: no Go toolchain, no Docker.
      # Deliberately its own job so a violation is reported even when the suite
      # itself is the thing timing out.
      #
      # The raw-deadline half was added by #66: 45 such deadlines across 27 files
      # carried no identifier for the old grep to find, so they sat outside the
      # count entirely. Renamed from "Eventually budget" because the job no
      # longer covers only Eventually sites.
      - name: Check test wait budgets fit the test timeout
        run: bash scripts/check-test-timeout.sh

  doc-refs:
    name: dangling document references (*.go)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # docs/adr/, docs/specs/, SECURITY.md and STABILITY.md were deleted in
      # 12630621; #50 stripped the ~2,240 references that survived. Nothing
      # stopped new ones being written and #55 wrote five more, two on exported
      # doc comments that render on pkg.go.dev — caught only because someone
      # happened to grep. This job is that grep, run every time.
      #
      # Scoped to *.go, which is both the escape hatch (commit messages and the
      # docs/ tree are untouched) and what makes the strong tree-wide form
      # possible: *.go is at zero, the tree overall is not. Tree-wide needs no
      # merge base, so the default shallow checkout above is sufficient and
      # there is no fetch-depth: 0 to forget.
      #
      # The script self-tests on every run, so a green result also proves the
      # scanner can still fail. Pure bash + git + grep: no Go toolchain, no
      # Docker. Its own job, so a violation is reported even when the suite is
      # red for unrelated reasons.
      - name: Check for dangling document references
        run: bash scripts/check-doc-refs.sh

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      # Per MODULE, not per repository: `go mod tidy` only ever touches the
      # module rooted at the working directory, so a single call at the root
      # left examples/go.mod unchecked — and an untidy nested go.mod is exactly
      # the drift that makes a workspace stop reproducing outside it. The diff
      # pathspec is a glob over every go.mod/go.sum in the tree plus go.work,
      # so a module added later is covered the day it appears rather than the
      # day someone remembers to extend a list. (`:(glob)**/go.mod` matches the
      # root go.mod as well as nested ones — verified with `git ls-files`.)
      - name: Verify every module's go.mod is tidy
        run: |
          set -euo pipefail
          mods="$(scripts/modules.sh)"
          for pat in ${mods}; do
            dir="${pat%/...}"
            echo "go mod tidy in ${dir}"
            ( cd "${dir}" && go mod tidy )
          done
          git diff --exit-code -- go.work ':(glob)**/go.mod' ':(glob)**/go.sum'

      # Pinned deliberately, on both axes.
      #
      # The action major selects the golangci-lint SERIES: v6 installs the v1
      # line, v9 installs v2. .golangci.yml here has been `version: "2"` all
      # along, so v6 was pairing a v2 config with a v1 binary. That mismatch was
      # masked by a louder failure — v1.64.8 is built with go1.24 and refuses a
      # go.mod targeting a newer Go with "the Go language version (go1.24) used
      # to build golangci-lint is lower than the targeted Go version". The job
      # exited 3 during config load, so it had NEVER linted a single file and
      # reported zero findings while doing so.
      #
      # `version: latest` is what let that drift in silently: the resolved
      # binary changed under us with no diff. An exact version means a lint
      # result only changes when this line does.
      # golangci-lint has no workspace-wide mode, and this job is the ONLY path
      # by which govet and gofmt reach CI at all — neither runs as its own step
      # anywhere, they arrive through .golangci.yml's `default: standard` and
      # its `formatters` block. So a lint job scoped to the root module
      # silently unscopes vet and gofmt too, and every module needs a step.
      #
      # ONE STEP PER MODULE, run from inside the module — NOT one step with a
      # cross-module pattern list. That is measured, not a style preference.
      # golangci-lint keys its cache by CONTENT and an entry carries the file
      # path as first seen; that is the #146 defect scripts/lint.sh exists for.
      # An entry warmed on a PRE-SPLIT tree, where examples/migrate/main.go sat
      # in the ROOT module, is re-read after the split as belonging to the
      # `examples` module and has the module directory prefixed AGAIN:
      # `examples/examples/migrate/main.go`. Nothing exists at that path, so
      # the nolint processor cannot read the file, the `//nolint:errorlint` on
      # examples/migrate/main.go:78 is silently dropped, and a PHANTOM finding
      # is reported. Reproduced deterministically with v2.13.2, one cache warmed
      # from a pre-split `golangci-lint run ./...`:
      #
      #   run ./... ./examples/...    -> 1 phantom issue, path doubled, exit 1
      #   run ./...     (from root)   -> 0 issues
      #   run ./...     (from examples/) -> 0 issues
      #
      # and the cross-module form re-run AFTER the two clean ones still failed,
      # proving the cache was still poisoned rather than repaired by them.
      #
      # The step list below is hand-written, so the check above is what keeps it
      # honest: add a module and this job goes red until it gets its own step.
      - name: Assert every workspace module has a lint step
        run: |
          set -euo pipefail
          # The working directories of the golangci-lint steps that follow.
          linted="$(printf '%s\n' '.' 'examples')"
          expected="$(scripts/modules.sh | awk '{ sub(/\/\.\.\.$/,""); sub(/^\.\//,""); print ($0=="" ? "." : $0) }')"
          if ! diff <(printf '%s\n' "${expected}" | sort) <(printf '%s\n' "${linted}" | sort); then
            echo "::error::a workspace module has no golangci-lint step in .github/workflows/ci.yml; it would be silently unlinted, and govet and gofmt with it" >&2
            exit 1
          fi
          echo "modules linted: ${linted}"

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: examples

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true
      # Pinned for the same reason as golangci-lint above: `@latest` lets the
      # scanner change without a diff. Note this pins the TOOL, not the answer —
      # govulncheck queries the vulnerability database at run time, so newly
      # published advisories still surface on the next run, which is the point.
      #
      # What actually keeps this job honest is the Go version. Every stdlib
      # finding is reported against the toolchain that built the code, so the
      # `go` directive in go.mod is the real input here; setup-go above reads it
      # via go-version-file.
      #
      # `govulncheck ./...` scans the ROOT MODULE ONLY under a workspace, and
      # prints "No vulnerabilities found" while doing it — a clean bill of
      # health for code it never looked at is the worst result this workflow
      # can produce. The patterns come from scripts/modules.sh, which cannot
      # emit an empty list. (`go install pkg@version` is workspace-independent,
      # so the install line is unaffected by go.work.)
      - name: Run govulncheck
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          mods="$(scripts/modules.sh)"
          echo "package patterns: ${mods}"
          govulncheck ${mods}

  dependency-review:
    name: dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
