version: 2
updates:
  - package-ecosystem: gomod
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      otel:
        patterns:
          - "go.opentelemetry.io/*"
    ignore:
      # gocron is held at its current version deliberately. Its one-shot
      # semantics are load-bearing here: WithLimitedRuns(1) must fire exactly
      # once and then report the timer as consumed via NextRun. A minor bump
      # has changed that behaviour before, and the change is silent — nothing
      # fails to compile. scheduler/internal/gocron/bump_regression_test.go
      # locks the current semantics; take a bump only by hand, with that test
      # green.
      - dependency-name: "github.com/go-co-op/gocron/v2"

  # examples/ is its own module (go.work `use ./examples`). Dependabot's gomod
  # ecosystem is per-DIRECTORY and stops at a nested go.mod, so the "/" entry
  # above cannot see examples/go.mod: without this second entry that module's
  # dependencies would never be updated and never be flagged — silently, since
  # the absence of a PR looks exactly like nothing to update.
  #
  # examples/go.mod deliberately pins the SAME versions as the root module
  # (measured: zero drift across the 129 shared requirements at the commit that
  # split it out), because go.work resolves the workspace build by MVS over the
  # union — a version raised here is a version the library is built against
  # locally and in CI. Keep the two in step when taking these PRs.
  - package-ecosystem: gomod
    directory: "/examples"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      - dependency-name: "github.com/go-co-op/gocron/v2"

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(ci)"
